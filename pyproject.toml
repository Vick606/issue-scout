[project]
name = "issue-scout"
version = "0.1.0"
description = "Curate GitHub issues into a versioned dataset for LLM bug-fixing evaluation."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "responses>=0.25",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["issue_scout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]